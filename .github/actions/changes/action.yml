name: Detect documentation-only changes
description: Compare the complete PR or push diff; run full CI when the comparison is uncertain.
outputs:
    docs-only:
        description: Whether every changed path is documentation
        value: ${{ steps.changes.outputs.docs-only }}
runs:
    using: composite
    steps:
        - id: changes
          shell: bash
          run: node .github/scripts/ci-changes.mjs
